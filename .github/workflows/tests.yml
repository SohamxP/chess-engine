name: PlySense CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Run Java engine and REST API tests
        run: mvn --batch-mode clean verify
      - name: Install Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend dependencies
        working-directory: web
        run: npm install --no-audit --no-fund
      - name: Run React frontend unit tests
        working-directory: web
        run: npm test
      - name: Type-check and build React UI
        working-directory: web
        run: npm run build
      - name: Install Playwright Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Run real-browser E2E tests against the Java API
        working-directory: web
        run: npm run test:e2e
      - name: Build production Docker image
        run: docker build --tag plysense:ci .
      - name: Smoke test deployed site and API from the Docker image
        shell: bash
        run: |
          docker run -d --name plysense-ci -p 127.0.0.1:18500:10000 plysense:ci
          trap 'docker logs --tail 60 plysense-ci; docker rm -f plysense-ci' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:18500/healthz | grep -q '^ok$'; then
              break
            fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:18500/healthz | grep -q '^ok$'
          curl --fail --silent http://127.0.0.1:18500/ | grep -q 'PlySense'
          curl --fail --silent -X POST http://127.0.0.1:18500/api/games \
            -H 'Content-Type: application/json' \
            -d '{"playAsWhite":true,"depth":1}' | grep -q '"status":"IN_PROGRESS"'
      - name: Upload browser test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-debug
          path: web/test-results
          if-no-files-found: ignore
